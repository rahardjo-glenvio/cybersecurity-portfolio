<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 246" width="32" height="32">
  <defs>
    <linearGradient id="g0" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#7fffff" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#00aadd" stop-opacity="0.88"/>
    </linearGradient>
    <linearGradient id="g1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00ffee" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#00bbff" stop-opacity="0.88"/>
    </linearGradient>
    <linearGradient id="g2" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#00ddff" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#0077bb" stop-opacity="0.80"/>
    </linearGradient>
    <linearGradient id="g3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00ccff" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#0088cc" stop-opacity="0.80"/>
    </linearGradient>
    <linearGradient id="g4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00aabb" stop-opacity="0.90"/>
      <stop offset="100%" stop-color="#005577" stop-opacity="0.88"/>
    </linearGradient>
    <filter id="glow">
