  </defs>
  <!-- Dark background circle -->
  <circle cx="100" cy="123" r="110" fill="#020c18"/>
  <!-- Shield pieces -->
  <path d="M100,18 L28,60 L28,118 L100,118 Z"  fill="url(#g0)" filter="url(#glow)"/>
  <path d="M100,18 L172,60 L172,118 L100,118 Z" fill="url(#g1)" filter="url(#glow)"/>
  <path d="M28,118 L100,118 L100,158 L28,158 Z"  fill="url(#g2)" filter="url(#glow)"/>
  <path d="M100,118 L172,118 L172,158 L100,158 Z" fill="url(#g3)" filter="url(#glow)"/>
  <path d="M28,158 L172,158 L100,228 Z"           fill="url(#g4)" filter="url(#glow)"/>
  <!-- Outer border -->
  <path d="M100,18 L172,60 L172,158 L100,228 L28,158 L28,60 Z"
