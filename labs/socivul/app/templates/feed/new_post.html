{% extends "base.html" %}
{% block title %}New Post • Socivul{% endblock %}

{% block content %}
<div class="page-wrapper" style="max-width:600px;">
  <div class="card" style="padding:32px;">
    <h2 style="font-size:18px; font-weight:600; margin-bottom:24px; text-align:center;">Create new post</h2>

    <form method="POST" action="/post/new" enctype="multipart/form-data">
      <div style="margin-bottom:16px;">
        <label style="display:block; font-weight:600; font-size:14px; margin-bottom:6px;">Photo</label>
        <div id="upload-area" style="border:2px dashed #dbdbdb; border-radius:8px; padding:40px; text-align:center; cursor:pointer; background:#fafafa;">
          <div id="upload-preview" style="display:none;">
            <img id="preview-img" src="" alt="Preview" style="max-width:100%; max-height:400px; border-radius:4px;">
          </div>
          <div id="upload-placeholder">
            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="#8e8e8e" stroke-width="1" style="width:64px;height:64px; margin:0 auto 12px; display:block;">
              <path stroke-linecap="round" stroke-linejoin="round" d="M2.25 15.75l5.159-5.159a2.25 2.25 0 013.182 0l5.159 5.159m-1.5-1.5l1.409-1.409a2.25 2.25 0 013.182 0l2.909 2.909m-18 3.75h16.5a1.5 1.5 0 001.5-1.5V6a1.5 1.5 0 00-1.5-1.5H3.75A1.5 1.5 0 002.25 6v12a1.5 1.5 0 001.5 1.5zm10.5-11.25h.008v.008h-.008V8.25zm.375 0a.375.375 0 11-.75 0 .375.375 0 01.75 0z"/>
            </svg>
            <p style="color:#8e8e8e; font-size:14px;">Drag photo here or click to select</p>
          </div>
          <input type="file" name="image" id="image-input" accept="image/*" style="display:none;">
        </div>
      </div>

      <div style="margin-bottom:20px;">
        <label style="display:block; font-weight:600; font-size:14px; margin-bottom:6px;">Caption</label>
        <textarea name="caption" placeholder="Write a caption…" rows="4" style="width:100%; border:1px solid #dbdbdb; border-radius:3px; padding:8px 10px; font-size:14px; resize:vertical; outline:none; font-family:inherit;"></textarea>
      </div>

      <button type="submit" class="btn btn-primary">Share</button>
    </form>
  </div>
</div>
{% endblock %}

{% block scripts %}
<script>
  const area = document.getElementById('upload-area');
  const input = document.getElementById('image-input');
  const preview = document.getElementById('upload-preview');
  const placeholder = document.getElementById('upload-placeholder');
  const previewImg = document.getElementById('preview-img');

  area.addEventListener('click', () => input.click());

  input.addEventListener('change', function() {
    if (this.files && this.files[0]) {
      const reader = new FileReader();
      reader.onload = e => {
        previewImg.src = e.target.result;
        preview.style.display = 'block';
        placeholder.style.display = 'none';
      };
      reader.readAsDataURL(this.files[0]);
    }
  });

  area.addEventListener('dragover', e => { e.preventDefault(); area.style.borderColor = '#0095f6'; });
  area.addEventListener('dragleave', () => { area.style.borderColor = '#dbdbdb'; });
  area.addEventListener('drop', e => {
    e.preventDefault();
    area.style.borderColor = '#dbdbdb';
    const dt = e.dataTransfer;
    if (dt.files.length) {
      input.files = dt.files;
      input.dispatchEvent(new Event('change'));
    }
  });
</script>
{% endblock %}
