<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reset Password • Socivul</title>
  <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
<div class="auth-wrapper">
  <div class="auth-card">
    <span class="auth-logo">Socivul</span>
    <h2 style="font-size:16px; font-weight:600; margin-bottom:8px;">Reset your password</h2>
    <p style="font-size:14px; color:#8e8e8e; margin-bottom:20px;">Enter your reset token and choose a new password.</p>

    {% if message %}
    <div class="success-msg">{{ message }}</div>
    {% endif %}

    <form method="POST" action="/reset-password">
      <input type="text" name="token" placeholder="Reset token" value="{{ token_param }}" required>
      <input type="password" name="password" placeholder="New password" required>
      <button type="submit" class="btn btn-primary">Reset Password</button>
    </form>
  </div>
  <div class="auth-alt">
    <a href="/login">Back to login</a>
  </div>
</div>
</body>
</html>
