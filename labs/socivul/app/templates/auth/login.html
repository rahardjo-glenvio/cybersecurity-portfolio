<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login • Socivul</title>
  <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
<div class="auth-wrapper">
  <div class="auth-card">
    <span class="auth-logo">Socivul</span>
    <p class="tagline">Sign in to see photos and videos from your friends.</p>

    {% if error %}
    <div class="error-msg">{{ error }}</div>
    {% endif %}

    <form method="POST" action="/login">
      <input type="text" name="username" placeholder="Username" required autocomplete="username">
      <input type="password" name="password" placeholder="Password" required autocomplete="current-password">
      <button type="submit" class="btn btn-primary">Log In</button>
    </form>

    <div style="text-align:center; margin-top: 14px;">
      <a href="/forgot-password" style="color: #385185; font-size:13px; font-weight:600;">Forgot password?</a>
    </div>
  </div>

  <div class="auth-alt">
    Don't have an account? <a href="/register">Sign up</a>
  </div>
</div>
<script src="/static/js/app.js"></script>
</body>
</html>
