<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Forgot Password • Socivul</title>
  <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
<div class="auth-wrapper">
  <div class="auth-card">
    <div style="text-align:center; margin-bottom:16px;">
      <svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" fill="none" viewBox="0 0 24 24" stroke="#262626" stroke-width="1">
        <path stroke-linecap="round" stroke-linejoin="round" d="M16.5 10.5V6.75a4.5 4.5 0 10-9 0v3.75m-.75 11.25h10.5a2.25 2.25 0 002.25-2.25v-6.75a2.25 2.25 0 00-2.25-2.25H6.75a2.25 2.25 0 00-2.25 2.25v6.75a2.25 2.25 0 002.25 2.25z"/>
      </svg>
    </div>
    <h2 style="font-size:16px; font-weight:600; margin-bottom:8px;">Trouble logging in?</h2>
    <p style="font-size:14px; color:#8e8e8e; margin-bottom:20px;">Enter your username and we'll send you a reset token.</p>

    {% if message %}
    <div class="{% if token_val %}success-msg{% else %}success-msg{% endif %}">{{ message }}</div>
    {% endif %}

    <form method="POST" action="/forgot-password">
      <input type="text" name="username" placeholder="Username" required>
      <button type="submit" class="btn btn-primary">Send Reset Token</button>
    </form>

    <div class="auth-divider"><span>OR</span></div>
    <a href="/register" style="display:block; text-align:center; font-weight:600; font-size:14px;">Create new account</a>
  </div>
  <div class="auth-alt">
    <a href="/login">Back to login</a>
  </div>
</div>
</body>
</html>
